[package]
name = "oci-zero-registry-demo"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "oci-zero-registry-demo"
required-features = ["local"]

[features]
default = []
local = []
wasm = ["dep:wasm-bindgen"]

[dependencies]
oci-zero = { path = "../.." }
wasm-bindgen = { version = "0.2", optional = true }

[build-dependencies]
oci-zero = { path = "../.." }
serde_json = "1"

[dev-dependencies]
ureq = { version = "=2.9.7", default-features = false, features = ["tls"] }
