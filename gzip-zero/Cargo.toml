[package]
name = "gzip-zero"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "A no-std, allocation-free streaming gzip decoder"
license = "MIT OR Apache-2.0"
repository = "https://github.com/pawelchcki/oci-zero"
readme = "README.md"
keywords = ["gzip", "deflate", "no-std", "streaming"]
categories = ["compression", "no-std"]

[features]
default = []

[dependencies]
miniz_oxide = { version = "0.9.1", default-features = false }

[dev-dependencies]
flate2 = "1"
