# Shared Bazzite coordinator; the action name is matched by .ci-toolkit.yml.
actions:
  - name: "Complexity comparison"
    self_hosted: true
    pool: "linux-amd64-kvm"
    platform_properties:
      workload-isolation-type: "none"
      container-image: "none"
      resources:bazzite-host: "1"
    resource_requests: { disk: 10GB }
    timeout: 130m
    allow_concurrent_runs: false
    triggers:
      push:
        branches: ["main"]
      pull_request:
        branches: ["main"]
    steps:
      - run: >-
          /var/lib/llm-cc/bin/llm-cc-coordinate
          --repository pawelchcki/oci-zero
          --default-branch main
