[package]
name = "oci-zero-no-std-extract"
version = "0.0.1"
edition = "2021"
rust-version = "1.91"
publish = false

[features]
bench-metrics = []

[[bin]]
name = "oci-zero-no-std-extract"
path = "src/main.rs"
test = false
bench = false

[dependencies]
critical-section = "1"
embedded-io = { version = "0.7", default-features = false }
embedded-io-async = { version = "0.7", default-features = false }
embedded-nal-async = "0.9"
mbedtls-rs = { version = "0.1", default-features = false, features = ["tls"] }
oci-zero = { path = "..", features = ["reqwless", "tls", "zstd"] }
rand_core = { version = "0.10.1", default-features = false }
rustix = { version = "1.1.4", default-features = false, features = ["fs", "net", "stdio"] }
