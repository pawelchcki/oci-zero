[package]
name = "oci-zero"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "A no-std, allocation-free streaming core for OCI registries"
license = "MIT OR Apache-2.0"
repository = "https://github.com/pawelchcki/oci-zero"
readme = "README.md"
keywords = ["oci", "containers", "registry", "no-std", "streaming"]
categories = ["no-std", "network-programming", "parser-implementations"]
# The ESP32-C3 firmware is a separate workspace with its own target, toolchain
# and `[patch.crates-io]` pins. Excluding it from the *package* as well keeps it
# out of the published `oci-zero` .crate.
exclude = ["examples/esp32c3-ota"]

[workspace]
members = ["gzip-zero", "no-std-extract", "tools/matter-qr", "web", "zstd-zero"]
# Not a member: it targets riscv32imc-unknown-none-elf and patches esp-hal to a
# git revision, neither of which may leak into the hosted crates.
exclude = ["examples/esp32c3-ota"]
resolver = "2"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"

[features]
default = []
docker-credentials = ["dep:base64", "dep:serde", "dep:serde_json"]
gzip = ["dep:gzip-zero"]
reqwless = [
    "dep:embedded-io",
    "dep:embedded-io-async",
    "dep:embedded-nal-async",
    "dep:reqwless",
]
tls = ["reqwless", "dep:mbedtls-rs"]
zstd = ["dep:zstd-zero"]

[dependencies]
base64 = { version = "0.22", optional = true }
embedded-io = { version = "0.7", default-features = false, optional = true }
embedded-io-async = { version = "0.7", default-features = false, optional = true }
embedded-nal-async = { version = "0.9", optional = true }
gzip-zero = { version = "0.1.0", path = "gzip-zero", optional = true }
mbedtls-rs = { version = "0.1", default-features = false, features = ["tls"], optional = true }
reqwless = { version = "0.14", default-features = false, optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
sha2 = { version = "0.10", default-features = false }
zstd-zero = { version = "0.1.0", path = "zstd-zero", optional = true }

[dev-dependencies]
ureq = { version = "=2.9.7", default-features = false, features = ["tls"] }
# Keep ureq's transitive dependencies compatible with the crate's Rust 1.75 MSRV.
url = "=2.4.1"
zeroize = "=1.8.1"

[[example]]
name = "extract_file"
required-features = ["zstd"]

[[example]]
name = "download_metadata"
required-features = ["docker-credentials"]
