[package]
name = "oci-zero-web"
version = "0.0.1"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]
test = false
doctest = false

[dependencies]
js-sys = "0.3"
oci-zero = { path = "..", features = ["gzip", "zstd"] }
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
sha2 = { version = "0.10", default-features = false }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
