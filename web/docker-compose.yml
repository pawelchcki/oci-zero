services:
  web:
    build:
      context: ..
      dockerfile: web/Dockerfile
    ports:
      - "127.0.0.1:${OCI_ZERO_WEB_PORT:-8000}:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 2s
      timeout: 2s
      retries: 15
